<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PumpSniper — Track new Solana tokens in real time</title>
  <meta name="description" content="PumpSniper tracks new Solana tokens in real time. Free iOS and Android app.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="PumpSniper">
  <meta property="og:description" content="Track new Solana tokens in real time.">
  <meta property="og:image" content="https://haraltti.github.io/icon.png">
  <meta property="og:url" content="https://haraltti.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PumpSniper">
  <meta name="twitter:description" content="Track new Solana tokens in real time.">
  <meta name="twitter:image" content="https://haraltti.github.io/icon.png">

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: #222222;
      --text: #f0f0f0;
      --sub: #888888;
      --gold: #BA7517;
      --gold-bright: #E3A93C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Scattered background stars, same gold used for ratings in the app */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stars span {
      position: absolute;
      color: var(--gold);
      opacity: 0.35;
      font-size: 12px;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars span { animation: none; opacity: 0.3; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      margin-bottom: 28px;
      box-shadow: 0 0 0 1px var(--border), 0 20px 60px -20px rgba(186, 117, 23, 0.35);
    }

    .wordmark {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    .wordmark .star {
      color: var(--gold-bright);
      margin: 0 2px;
    }

    .tagline {
      font-size: 17px;
      color: var(--sub);
      font-weight: 300;
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 56px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 22px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .badge:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .badge svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--gold-bright);
    }

    .badge-text {
      text-align: left;
      line-height: 1.25;
    }

    .badge-text .small {
      display: block;
      font-size: 10px;
      color: var(--sub);
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
    }

    .badge-text .big {
      display: block;
      font-size: 15px;
      font-weight: 500;
    }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--sub);
      font-family: 'Space Mono', monospace;
      line-height: 2;
    }

    footer a {
      color: var(--sub);
      text-decoration: none;
    }

    footer a:hover {
      color: #4ade80;
    }

    footer .current { color: #444; }
    footer .sep { margin: 0 10px; color: #555; }
  </style>
</head>
<body>

  <div class="stars" aria-hidden="true">

    <span style="top: 22%; left: 88%; font-size: 14px; animation-delay: 0.6s;">★</span>
    <span style="top: 68%; left: 6%; font-size: 16px; animation-delay: 1.2s;">★</span>
    <span style="top: 78%; left: 92%; font-size: 11px; animation-delay: 1.8s;">★</span>
    <span style="top: 8%; left: 45%; font-size: 9px; animation-delay: 2.2s;">★</span>
    <span style="top: 90%; left: 40%; font-size: 12px; animation-delay: 0.9s;">★</span>
    <span style="top: 38%; left: 4%; font-size: 10px; animation-delay: 1.5s;">★</span>
    <span style="top: 50%; left: 94%; font-size: 13px; animation-delay: 2.6s;">★</span>
    <span style="top: 30%; left: 20%; font-size: 8px; animation-delay: 3s;">★</span>
    <span style="top: 62%; left: 75%; font-size: 9px; animation-delay: 0.3s;">★</span>
  </div>

  <main>
    <img class="icon" src="icon.png" alt="PumpSniper icon">
    <h1 class="wordmark">PumpSniper</h1>

        <svg viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 8 184.8 8 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 37.3 59 128.8 107.2 127.3 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-84 102.6-121.4-65.2-30.7-65.7-90-65.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        <span class="badge-text"><span class="small">Download on the</span><span class="big">App Store</span></span>
      </a>
      <a class="badge" href="https://play.google.com/store/apps/details?id=com.haraltti.pumpsniper" aria-label="Get it on Google Play">
        <svg viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3L104.6 13.6c-5-3.9-11.9-4.7-17.6-1.6-5.7 3.1-9 9.3-8.4 15.7v456.6c-.6 6.4 2.7 12.6 8.4 15.7 5.7 3.1 12.6 2.3 17.6-1.6l220.7-220.7c8.6-8.6 8.6-22.7 0-31.4zm42.7-14.9l-49.8-28.7-56.4 56.3 56.4 56.3 49.9-28.8c16-10.4 16-33.7-.1-55.1z"/></svg>
        <span class="badge-text"><span class="small">GET IT ON</span><span class="big">Google Play</span></span>

    </div>
  </main>

  <footer>
    <div>
      <span class="current" aria-current="page">PumpSniper</span><span class="sep">·</span><a href="https://haraltti.github.io/pumpsniper-support/">Support</a><span class="sep">·</span><a href="https://haraltti.github.io/pumpsniper-privacy/">Privacy</a><span class="sep">·</span><a href="https://x.com/PumpSniperApp">X</a>
    </div>
    <div>© 2026 PumpSniper · Made with 💚 in Finland</div>
  </footer>

</body>
</html>
